defaults:
  model: gpt-4o
  temperature: 1

target_sets:
  Summary:
    - OE_Summary
    - Code_Summary
    - Roadmap_Summary
  OE_and_Code:
    - OE_Summary
    - Code_Summary
  project_deep:
    - Proj_의사결정및설계근거
    - Proj_문제해결및최적화
    - Proj_기술적서사및흐름
    - Proj_성과및수치
  데이터요약:
    - 정제
    - AI_대화_로드맵
patterns:
  OE_Summary:
    output_suffix: "_OE_Summary.md"
    use_subject_prefix: true
    system_role: "You are a Senior Technical Writer. You create a 'Detailed Architecture Guidebook' with rich context."
    prompt_template: |
      [Context Data]
      {context}

      [🔥 CRITICAL FORMATTING RULES]
      1. **Mandatory Tagging**: Callout 제목에 `■ 태그명` 필수 포함.
      2. **Text Inside Box**: 모든 설명과 리스트는 Callout(`>`) 내부에 작성.
      3. **No Code Blocks**: 코드는 절대 넣지 말고, **글로 풀어서 설명**하거나 **파일 링크**로 대체.
      4. **Detailed Description**: 각 파일에 대해 **2~3문장의 상세 설명**을 작성할 것.
      5. **Full Reference**: `→ [[파일명]]` 링크 필수.

      ---
      [💾 출력 가이드]
      - 파일명: `[주제]_OE_Summary.md`
      - **Callout 매핑**:
        - 시스템 개요 → `> [!ABSTRACT] ■ 시스템 개요`
        - 상세 구성 및 파일 → `> [!INFO] ■ 구성 요소 상세`
        - 로직 흐름(글) → `> [!LOGIC-FLOW] ■ 동작 메커니즘`
        - 설계 의도 → `> [!RATIONALE] ■ 설계 의도`

      ---
      [🚨 MISSION: DETAILED GUIDEBOOK]
      이 문서는 코드를 보지 않고도 시스템을 이해할 수 있는 **상세 해설서**입니다.
      단순한 나열을 넘어, 각 파일이 **무슨 역할을 하며, 어떤 방식으로 구현되어 있는지 3줄 내외로 서술**하십시오.

      [출력 템플릿 예시]

      # 📘 {subject} 시스템 기술 명세서

      ## 📍 1. 시스템 아키텍처 개요

      > [!ABSTRACT] ■ 시스템 개요
      > - 이 시스템은 **대용량 로그의 실시간 정제 및 적재**를 담당합니다.
      > - 확장성을 위해 수집(Collector)과 정제(Cleaner) 모듈이 느슨하게 결합(Loose Coupling)되어 있습니다.
      > - 모든 데이터 흐름은 추적 가능하도록 고유 ID를 기반으로 로깅됩니다.

      ---

      ## ⚙️ 2. 모듈별 상세 명세 (Component Specs)

      ### 2.1 [주제 1: 데이터 수집기 (Collector)]

      > [!LOGIC-FLOW] ■ 동작 메커니즘
      > - 스케줄러가 1분마다 트리거를 발생시키면, API 클라이언트가 외부 서버에 요청을 보냅니다.
      > - 응답받은 JSON 데이터의 유효성을 1차 검증하고, 실패 시 지수 백오프(Exponential Backoff)로 재시도합니다.

      > [!INFO] ■ 구성 요소 상세
      > - **Collector Core**: 스케줄링 및 전체 수집 파이프라인을 제어하는 메인 컨트롤러입니다. 에러 발생 시 알림을 보내는 로직이 포함되어 있습니다. → [[collector_main.py]]
      > - **API Client**: 외부 REST API와의 통신을 전담하는 래퍼(Wrapper) 클래스입니다. `requests` 라이브러리를 사용하여 타임아웃과 헤더 처리를 캡슐화했습니다. → [[api_client.py]]
      > - **Auth Manager**: OAuth2 인증 토큰을 관리합니다. 토큰 만료 시 자동으로 갱신(Refresh)하여 끊김 없는 연결을 보장합니다. → [[auth.py]]

      ### 2.2 [주제 2: 데이터 정제 엔진 (Cleaner)]

      > [!RATIONALE] ■ 설계 의도
      > - 정제 규칙은 비즈니스 요건에 따라 자주 변경되므로, 코드가 아닌 **설정 파일(YAML)**로 분리했습니다.
      > - 이를 통해 개발자의 개입 없이도 운영팀에서 규칙을 수정할 수 있습니다.

      > [!INFO] ■ 구성 요소 상세
      > - **Cleaner Engine**: 설정된 규칙에 따라 텍스트의 특수문자를 제거하고 형식을 통일합니다. 정규표현식을 컴파일하여 처리 속도를 최적화했습니다. → [[cleaner.py]]
      > - **Schema Validator**: 데이터가 DB 적재 스키마와 일치하는지 검사합니다. 필수 필드 누락이나 타입 불일치를 사전에 차단하는 방어막 역할을 합니다. → [[validator.py]]
      > - **Rule Config**: 필터링할 키워드와 치환 규칙이 정의된 설정 파일입니다. 우선순위에 따라 순차적으로 적용됩니다. → [[rules.yaml]]

      ---

      ## 🔮 3. 참조 및 유틸리티

      > [!INFO] ■ 공통 모듈
      > - **Global Logger**: 시스템 전역에서 사용되는 로깅 설정을 정의합니다. 콘솔 출력과 동시에 파일로 로테이션 저장되도록 구성되었습니다. → [[logger.py]]
      > - **Utils**: 날짜 변환, 문자열 처리 등 여러 모듈에서 재사용되는 헬퍼 함수들의 집합입니다. → [[common_utils.py]]
      

  Code_Summary:
    output_suffix: "_Code_Summary.md"
    use_subject_prefix: true
    system_role: "You are a Senior Code Librarian. You create a 'Navigational Map' for the codebase."
    prompt_template: |
      [Context Data]
      {context}

      [🔥 CRITICAL FORMATTING RULES]
      (이 규칙은 문서의 기능성(검색/복사)을 위해 절대적입니다.)

      1. **Mandatory Tagging (태깅 필수)**:
         - 모든 Callout의 제목에는 지정된 태그(`■ 태그명`)를 반드시 포함하십시오.

      2. **Content Segregation (내용 분리)**:
         - **리스트/텍스트**: Callout **내부**에 작성하십시오. (모든 줄에 `>` 접두사 사용)
         - **코드/로그**: 필요하다면 Callout **외부**에 작성하십시오. (이 문서에서는 주로 리스트가 사용됨)

      3. **One-Line Definition (한 줄 정의)**:
         - 복잡한 설명 금지. 기능은 무조건 **한 줄**로 요약하십시오.
         - 형식: `**함수/클래스명**: (한 줄 설명) → [[원본파일]]`

      ---
      [💾 파일 및 출력 가이드]
      1. 추천 파일명: `[주제]_Code_Summary.md`
      2. **Callout 매핑**:
         - 파일/모듈 구조 → `> [!INFO] ■ 디렉토리 구조`
         - 핵심 기능 인덱스 → `> [!CODE] ■ 코드 인덱스`
         - 유틸리티/기타 → `> [!ABSTRACT] ■ 유틸리티 모음`

      ---
      [🚨 MISSION: CODE MAP & INDEX]
      분석하지 말고 **나열(List)**하십시오.
      이 문서는 **"어떤 기능이 어떤 파일에 있는지"** 찾는 지도입니다.
      입력된 모든 코드 파일에서 **주요 클래스, 함수, 상수**를 추출하여 원본 링크와 함께 정리하십시오.

      [출력 템플릿 예시]

      # 🗺️ {subject} 코드 내비게이션 맵

      ## 📍 1. 전체 파일 구조 (File Structure)
      *(입력된 파일들의 목록)*

      > [!INFO] ■ 디렉토리 구조
      > - **Main Logic**: `main.py`, `processor.py`
      > - **Utils**: `helper.py`, `converter.py`
      > - **Config**: `config.yaml`, `settings.py`

      ---

      ## 📍 2. 핵심 로직 인덱스 (Core Logic)
      *(주요 비즈니스 로직을 담당하는 코드들)*

      > [!CODE] ■ 코드 인덱스
      > - **`ProcessHandler` (Class)**: 데이터 전처리 및 파이프라인 총괄 → [[processor.py]]
      > - **`run_inference` (Func)**: 모델 추론을 실행하고 결과를 반환함 → [[main.py]]
      > - **`load_model` (Func)**: ONNX 모델을 메모리에 로드함 → [[loader.py]]

      ---

      ## 📍 3. 유틸리티 및 헬퍼 (Utils)
      *(보조적인 기능을 수행하는 코드들)*

      > [!ABSTRACT] ■ 유틸리티 모음
      > - **`clean_text` (Func)**: 특수문자 제거 및 정규화 수행 → [[helper.py]]
      > - **`save_json` (Func)**: 딕셔너리를 JSON 파일로 안전하게 저장 → [[io_utils.py]]
      > - **`DATE_FMT` (Const)**: 날짜 포맷 상수 (`%Y-%m-%d`) → [[config.py]]

      ---

      ## 🔗 4. 참조 연결
      - **전체 원본 파일**:
        - [[processor.py]]
        - [[main.py]]
        - [[helper.py]]

  Roadmap_Summary:
    output_suffix: "_Roadmap.md"
    use_subject_prefix: true
    system_role: "You are a Technical Historian. You document the 'Evolutionary Context' of the project in detail."
    prompt_template: |

      [Context Data]
      {context}

      [🔥 CRITICAL FORMATTING RULES]
      1. **Mandatory Tagging**: Callout 제목에 `■ 태그명` 필수.
      2. **Text Inside Box**: 모든 설명은 `>` 박스 내부 작성.
      3. **No Code Dump**: 코드는 넣지 말고, **상세한 작업 내역(글)**과 **파일 링크**로 대체.
      4. **Detailed Description**: 각 파일에 대해 **무엇을, 왜, 어떻게 구현했는지 3줄 내외로 서술**.
      5. **Full Reference**: `→ [[파일명]]` 링크 필수.

      ---
      [💾 출력 가이드]
      - 파일명: `[주제]_Roadmap.md`
      - **Callout 매핑**:
        - 단계 목표 → `> [!ABSTRACT] ■ 단계 목표`
        - 상세 작업 내역 → `> [!LOGIC-FLOW] ■ 상세 작업 내역 및 산출물`
        - 연결 고리(Why) → `> [!RATIONALE] ■ 다음 단계로의 연결`

      ---
      [🚨 MISSION: DETAILED HISTORY]
      각 단계(Phase)에서 **어떤 사고 과정을 거쳐 파일들이 만들어졌는지** 상세히 기록하십시오.
      파일명 옆에 단순히 기능만 적지 말고, **구현 방식과 의도를 포함하여 3줄 내외로 설명**하십시오.

      [출력 템플릿 예시]

      # 🗺️ {subject} 프로젝트 상세 로드맵

      ## 🎯 1. 전체 여정 요약

      | 단계 | 핵심 목표 | 주요 산출물 |
      | :--- | :--- | :--- |
      | Phase 1 | MVP 구축 | [[main.py]], [[core.py]] |
      | Phase 2 | 안정성 강화 | [[exceptions.py]] |

      ---

      ## 🧭 2. 단계별 진화 과정 (Evolution)

      ### 🟢 Phase 1. [기반 구조 설계 및 MVP]

      > [!ABSTRACT] ■ 단계 목표
      > 프로젝트의 디렉토리 구조를 확립하고, 핵심 비즈니스 로직인 '데이터 수집' 기능을 최소 기능 제품(MVP) 형태로 구현했습니다.

      > [!LOGIC-FLOW] ■ 상세 작업 내역 및 산출물
      > - **기본 설정 관리**: 하드코딩을 피하기 위해 환경 변수와 상수를 관리하는 모듈을 생성했습니다. `dotenv`를 사용하여 보안 키를 분리했습니다. → [[config.py]]
      > - **데이터 모델링**: 수집할 데이터의 스키마를 정의하고, Pydantic을 활용하여 타입 안정성을 확보했습니다. 이를 통해 잘못된 데이터 유입을 초기에 차단합니다. → [[models.py]]
      > - **메인 로직 구현**: CLI 명령어로 실행 가능한 엔트리포인트를 작성했습니다. `argparse`를 통해 사용자가 옵션을 쉽게 조절할 수 있도록 했습니다. → [[main.py]]

      > [!RATIONALE] ■ 다음 단계로의 연결
      > - 핵심 기능은 동작하지만, 예외 상황(네트워크 단절 등)에 대한 처리가 미흡하여 프로그램이 자주 종료됨.
      > - 따라서 다음 단계는 **견고한 에러 핸들링과 로깅 시스템** 구축에 집중하기로 함.

      ### 🟡 Phase 2. [안정성 강화 및 모듈화]

      > [!ABSTRACT] ■ 단계 목표
      > 스파게티 코드가 되지 않도록 기능을 모듈 단위로 분리하고, 예상치 못한 에러에도 시스템이 멈추지 않도록 안정성을 보강했습니다.

      > [!LOGIC-FLOW] ■ 상세 작업 내역 및 산출물
      > - **커스텀 예외 정의**: 시스템에서 발생할 수 있는 에러를 비즈니스 로직별로 세분화했습니다. 이를 통해 에러 발생 시 원인을 즉시 파악할 수 있게 되었습니다. → [[exceptions.py]]
      > - **로깅 시스템 구축**: 콘솔 출력뿐만 아니라 파일로 로그를 남기도록 설정했습니다. 날짜별로 로그가 로테이션되도록 하여 디스크 용량을 관리합니다. → [[logger.py]]
      > - **유틸리티 분리**: 여러 곳에서 중복 사용되던 날짜 변환 및 문자열 처리 함수들을 별도 파일로 모았습니다. 코드 재사용성이 크게 향상되었습니다. → [[utils.py]]

      ---

      ## 🔮 3. 현재 상태 및 Future Work
      - **Current**: v1.0 배포 완료. (안정성 테스트 통과)
      - **Next**: 사용자 피드백을 반영하여 **웹 대시보드 연동** 기능 개발 예정. → [[web_server.py]] (Todo)
      

  Hybrid_Spec:
    output_suffix: "_TechBlueprint.md"
    use_subject_prefix: true
    system_role: "You are a CTO & Chief Architect. You document both the 'Current Technical Specification' and the 'Evolutionary Decision History'."
    prompt_template: |
      
      [Context Data]
      {context}
      
      [🔥 CRITICAL FORMATTING RULES]
      (이 규칙은 문서의 기능성(검색/복사)을 위해 절대적입니다.)
      
      1. **Mandatory Tagging (태깅 필수)**:
         - 모든 Callout의 제목에는 지정된 태그(`■ 태그명`)를 반드시 포함하십시오.
         - 예: `> [!RATIONALE] ■ 판단 근거`
      
      2. **Content Segregation (내용 분리 정책 - 중요)**:
         - **텍스트/리스트**: Callout **내부**에 작성하십시오. (모든 줄에 `>` 접두사 사용)
         - **코드/로그/표**: Callout **외부(바로 아랫줄)**에 작성하십시오. (`>` 접두사 금지)
      
      3. **Visual Structure (작성 예시)**:
         반드시 아래 패턴을 따르십시오.
         
         ✅ **[올바른 예시: 텍스트는 안(In), 코드는 밖(Out)]**
         > [!LOGIC-FLOW] ■ 동작 흐름
         > - 아래 코드는 데이터를 정규화하는 로직입니다. (텍스트는 박스 안)
         
         ```python
         # 코드는 박스 밖 (깨끗한 상태, 복사 용이)
         def clean_data(data):
             return data.strip()
         ```
         
         ❌ **[틀린 예시: 코드를 박스에 넣음]**
         > [!LOGIC-FLOW] ■ 동작 흐름
         > ```python
         > # 이렇게 하면 복사할 때 >가 같이 복사됨 (금지)
         > ```
      
      4. **Whitespace Enforcement (여백 강제)**:
         - Callout이 끝나고 코드/표가 시작되기 전에는 **반드시 빈 줄(Empty Line)**을 하나 두어 렌더링 오류를 방지하십시오.
      
      ---
      [💾 콘텐츠 매핑 및 가이드]
      1. 추천 파일명: `[주제]_TechBlueprint.md`
      
      2. **섹션별 Callout 매핑 (혼합 모델)**:
       - [Spec] 기술 개요/정의 → `> [!ABSTRACT] ■ 기술 원리`
       - [Roadmap] 결정의 근거 → `> [!RATIONALE] ■ 판단 근거`
       - [Roadmap] 대안 비교 → `> [!TRADE-OFF] ■ 대안 비교`
       - [Spec] 동작/구현 흐름 → `> [!LOGIC-FLOW] ■ 동작 흐름`
