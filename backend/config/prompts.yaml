      > import os
      > import pandas as pd
      > from typing import Iterator
      > 
      > # 독립 실행 가능하도록 import 포함
      > def load_csv_chunked(
      >     file_path: str,  # TODO: 파일 경로 수정
      >     chunk_size: int = 1000
      > ) -> Iterator[pd.DataFrame]:
      >     """
      >     Generator 함수입니다.
      >     """
      >     if not os.path.exists(file_path):
      >         raise FileNotFoundError(f"Path not found: {file_path}")
      > 
      >     try:
      >         # 모든 줄 앞에 > 필수
      >         reader = pd.read_csv(file_path, chunksize=chunk_size)
      >         for chunk in reader:
      >             yield chunk
      >     except Exception as e:
      >         print(f"Error: {e}")
      > ```

      > [!TIP] ■ Custom Point
      > - **`chunk_size`**: 메모리가 16GB 이하라면 5000 이하로 낮추십시오.
      > - **`encoding`**: 한글 파일의 경우 `cp949` 또는 `euc-kr`로 변경 필요.

