      # 📊 {subject} 프레젠테이션 스토리보드

      ## 🎯 1. 전체 개요 (Executive Summary)
      > [!ABSTRACT] ■ Key Message
      > 이 발표는 **AI 엔지니어를 위한 웹 앱 프레임워크(Streamlit)**의 기초부터 배포까지를 다룹니다.

      ---

      ## 📕 Chapter 1. 웹 애플리케이션의 이해

      ### Slide 1.1: 웹 서비스의 작동 원리

      > [!ABSTRACT] ■ Key Message
      > 웹은 클라이언트(요청)와 서버(응답)의 상호작용으로 이루어집니다.

      **1. 기본 개념**
      - **클라이언트**: 사용자의 브라우저 (요청 발송)
      - **서버**: 데이터 가공 및 응답 (Response)
      - **URL**: 서버의 위치를 찾는 주소

      > [!INFO] ■ Visual Guide
      > - 좌측에 노트북(클라이언트), 우측에 서버 아이콘 배치.
      > - 화살표로 Request(요청)와 Response(응답) 흐름 도식화.

      > [!TIP] ■ Speaker Notes
      > "우리가 매일 쓰는 웹은 사실 단순한 요청과 응답의 반복입니다. AI 모델을 서빙할 때도 이 구조는 변하지 않습니다."

      ---

      ## 📙 Chapter 2. Streamlit 기초

      ### Slide 2.1: 왜 Streamlit인가?

      > [!ABSTRACT] ■ Key Message
      > 데이터 과학자를 위해 탄생한, **HTML/CSS 없이 Python만으로** 만드는 웹 앱입니다.

      **1. 기존 vs Streamlit**
      | 구분 | 기존 방식 (Flask/Django) | Streamlit |
      | :--- | :--- | :--- |
      | 언어 | HTML, CSS, JS, Python | **Python 100%** |
      | 난이도 | 높음 (프론트엔드 지식 필요) | **낮음 (직관적 API)** |
      | 용도 | 범용 웹 서비스 | **데이터 대시보드, 프로토타입** |

      **2. 핵심 코드 예시**
      ```python
      import streamlit as st
      st.title("Hello AI")
      st.line_chart(data)
      ```

      > [!INFO] ■ Visual Guide
      > - "Python Code"가 마법처럼 "Web App"으로 변하는 애니메이션 효과 이미지 추천.

