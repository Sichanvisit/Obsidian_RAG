      # 🛠️ Troubleshooter: {subject}

      ## 🎯 1. 트러블슈팅 앵커

      | 이슈 | 원인 | 해결 | 수정 파일 |
      | :--- | :--- | :--- | :--- |
      | OOM | 메모리 누수 | 배치 축소 | [[train.py]] |

      ---

      ## 🔍 2. 현상 및 로그

      > [!WARNING] ■ 증상 및 로그
      > - 학습 시작 10분 후 `CUDA out of memory` 발생하며 프로세스 킬.
      > - GPU 모니터링 시 VRAM 사용량이 선형적으로 증가함.

      *(로그 원문 - 박스 밖)*
      ```text
      RuntimeError: CUDA out of memory. Tried to allocate 128.00 MiB (GPU 0; 24.00 GiB total capacity; 23.10 GiB already allocated...)
      ```

      ## 💡 3. 해결 과정

      > [!RATIONALE] ■ 원인 상세
      > - **가설**: `loss.backward()` 호출 시 계산 그래프가 누적되고 있다고 판단했습니다.
      > - **검증**: `loss.item()` 대신 `loss` 객체 자체를 리스트에 append 하고 있어 그래프가 해제되지 않았음이 확인되었습니다.
      > - **위치**: `trainer.py`의 142번째 라인. → [[trainer.py]]

      ### 💻 Final Fix

      > [!CODE] ■ 해결 방안 및 패치
      > - 누적되는 loss 값을 텐서가 아닌 Python float 값으로 변환하여 저장하도록 수정했습니다.
      > - `loss` -> `loss.item()` 변경.

      *(코드 - 박스 밖)*
      ```python
      # [Before] 메모리 누수 발생
      total_loss.append(loss)

      # [After] 수정됨
      total_loss.append(loss.item())
      ```

      ## 🔗 4. 회고 및 방지책

      > [!LIGHTBULB] ■ Post-Mortem
      > - **근본 원인**: PyTorch의 Computational Graph 유지 메커니즘에 대한 이해 부족.
      > - **재발 방지**: 코드 리뷰 체크리스트에 'Loop 내 텐서 저장 금지' 항목 추가함.

