version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OBSIDIAN_VAULT_PATH=C:\Users\bhs33\Desktop\옵시디언(시찬)\Sichan
      - VECTOR_DB_PATH=./data/vector_store
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    networks:
      - rag_network
    command: python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - ./projects:/app/projects
    networks:
      - rag_network
    command: streamlit run frontend/app.py

networks:
  rag_network:
    driver: bridge
